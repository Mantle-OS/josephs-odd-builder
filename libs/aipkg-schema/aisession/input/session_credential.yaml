# session_credential.yaml
tag: "session.session_credential"
version: 1
unit: "session"
base: "session_credential"
c_struct: "AiSessionCredential"
include_prefix: "aisession"
out_base: "session_credential"
fields:
  - key: 1
    name: "credential_id"
    type: "str"
    required: true

  - key: 2
    name: "provider"
    type: "u32"
    required: true
    comment: "HUGGING_FACE=0, OPENAI=1, GITHUB=2, LOCAL=3"

  - key: 3
    name: "name"
    type: "str"
    required: true
    comment: "default, work, personal, etc."

  - key: 4
    name: "kind"
    type: "u32"
    required: true
    comment: "BEARER_TOKEN=0, API_KEY=1, BASIC=2"

  - key: 5
    name: "secret"
    type: "bin"
    required: true
    comment: "Loaded into QSecureMem after vault unlock."

  - key: 6
    name: "created_at"
    type: "str"
    required: false

  - key: 7
    name: "last_used"
    type: "str"
    required: false

  - key: 8
    name: "enabled"
    type: "bool"
    required: true

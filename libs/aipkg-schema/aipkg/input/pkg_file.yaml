tag: "pkg.file"
version: 1
unit: "pkg"
base: "file"
include_prefix: "aipkg"
c_struct: "AiPkgFile"
out_base: "pkg_file"
fields:
  - name: "name"
    type: "str"
    required: true
  - name: "enabled"
    type: "bool"
    required: true
  - name: "size"
    type: "u64"
    required: false
    comment: "after install"
  - name: "upstream_sha"
    type: "str"
    required: true
    comment: "Upstream Sha of the file, one can get this from the web ui or using git. There are issues way out of my control for using api's or libgit2 for auto generation"
  - name: "sha"
    type: "bin[32]"
    required: false
    comment: "The file that is going to get installed hash"

    type: "str"
    required: true
  - name: "enabled"
    type: "bool"
    required: true
  - name: "size"
    type: "u64"
    required: false
    comment: "after install"
  - name: "sha"
    type: "u32"
    required: false
    comment: "after install the blake9 no really needed here"
